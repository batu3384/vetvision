<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="640" rx="32" fill="#07131B"/>
  <rect x="36" y="36" width="1128" height="568" rx="24" fill="url(#panel)"/>
  <circle cx="980" cy="168" r="120" fill="#0EA5E9" opacity="0.14"/>
  <circle cx="880" cy="480" r="180" fill="#14B8A6" opacity="0.12"/>
  <rect x="86" y="82" width="160" height="32" rx="16" fill="#0C2330"/>
  <text x="112" y="103" fill="#F0FBFF" font-size="14" font-family="Arial, Helvetica, sans-serif" letter-spacing="2">VETVISION</text>
  <text x="86" y="176" fill="#F0FBFF" font-size="56" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Desktop AI for dog</text>
  <text x="86" y="232" fill="#F0FBFF" font-size="56" font-weight="700" font-family="Georgia, 'Times New Roman', serif">breed recognition.</text>
  <text x="86" y="282" fill="#CCE7EE" font-size="24" font-family="Arial, Helvetica, sans-serif">Image classification, breed-aware guidance, PDF export,</text>
  <text x="86" y="316" fill="#CCE7EE" font-size="24" font-family="Arial, Helvetica, sans-serif">and an optional Gemini-backed report workflow.</text>

  <rect x="86" y="382" width="520" height="126" rx="20" fill="#0D2330" stroke="#1D4554"/>
  <text x="116" y="420" fill="#67E8F9" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Current repository scope</text>
  <text x="116" y="456" fill="#F0FBFF" font-size="20" font-family="Arial, Helvetica, sans-serif">CustomTkinter desktop app, training script,</text>
  <text x="116" y="486" fill="#F0FBFF" font-size="20" font-family="Arial, Helvetica, sans-serif">model artifact, labels, and evaluation outputs.</text>

  <rect x="702" y="96" width="390" height="164" rx="22" fill="#F5FDFF"/>
  <text x="732" y="136" fill="#0F766E" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">App behavior</text>
  <text x="732" y="176" fill="#07131B" font-size="40" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Image in, report out</text>
  <text x="732" y="214" fill="#47616C" font-size="20" font-family="Arial, Helvetica, sans-serif">Load a dog photo, review the top predictions,</text>
  <text x="732" y="242" fill="#47616C" font-size="20" font-family="Arial, Helvetica, sans-serif">then export a PDF or trigger LLM guidance.</text>

  <rect x="702" y="292" width="184" height="124" rx="20" fill="#0D2330"/>
  <text x="728" y="328" fill="#67E8F9" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif">Inference</text>
  <text x="728" y="362" fill="#F0FBFF" font-size="28" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Top predictions</text>
  <text x="728" y="392" fill="#CCE7EE" font-size="18" font-family="Arial, Helvetica, sans-serif">Breed label</text>
  <text x="728" y="414" fill="#CCE7EE" font-size="18" font-family="Arial, Helvetica, sans-serif">confidence</text>

  <rect x="908" y="292" width="184" height="124" rx="20" fill="#0D2330"/>
  <text x="934" y="328" fill="#67E8F9" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif">Output</text>
  <text x="934" y="362" fill="#F0FBFF" font-size="28" font-weight="700" font-family="Georgia, 'Times New Roman', serif">PDF + text</text>
  <text x="934" y="392" fill="#CCE7EE" font-size="18" font-family="Arial, Helvetica, sans-serif">Local export</text>
  <text x="934" y="414" fill="#CCE7EE" font-size="18" font-family="Arial, Helvetica, sans-serif">optional Gemini</text>

  <rect x="702" y="444" width="390" height="104" rx="20" fill="#F5FDFF"/>
  <text x="732" y="480" fill="#0F766E" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">Academic delivery</text>
  <text x="732" y="513" fill="#47616C" font-size="20" font-family="Arial, Helvetica, sans-serif">Built as the VetVision course project for dog breed</text>
  <text x="732" y="539" fill="#47616C" font-size="20" font-family="Arial, Helvetica, sans-serif">analysis and veterinary-style AI assistance.</text>

  <defs>
    <linearGradient id="panel" x1="36" y1="36" x2="1164" y2="604" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1D26"/>
      <stop offset="1" stop-color="#12313B"/>
    </linearGradient>
  </defs>
</svg>
